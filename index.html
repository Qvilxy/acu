<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BCB Casino</title>
    <!-- Подключаем скрипт Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Общие стили */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Градиентный фон, похожий на ваше фото (темно-бордовый/фиолетовый) */
            background: linear-gradient(135deg, #4a0e2d, #7b1f4c);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden; /* Убираем прокрутку во время загрузки */
        }

        /* Стили для экрана загрузки */
        #loading-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            background: inherit; /* Наследуем фон от body */
            transition: opacity 0.5s ease-out; /* Плавное исчезновение */
        }

        .loading-logo {
            max-width: 60%; /* Адаптивный размер логотипа */
            max-height: 40vh;
            object-fit: contain;
            animation: fadeInScale 1.5s ease-in-out forwards;
        }

        .loading-text {
            margin-top: 25px;
            font-size: 1.2em;
            font-weight: 500;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeInPulse 2s infinite 1s; /* Начинается после появления лого */
        }

        /* Стили для основного интерфейса */
        #app-interface {
            display: none; /* Скрыт по умолчанию */
            width: 90%;
            max-width: 400px;
            padding: 30px 20px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: slideUpFade 0.6s ease-out forwards;
        }

        #app-interface h1 {
            margin-top: 0;
            font-size: 1.8em;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        #app-interface p {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }

        /* Анимации */
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeInPulse {
            0% { opacity: 0.4; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
            100% { opacity: 0.4; transform: translateY(0); }
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Класс для плавного скрытия загрузочного экрана */
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loading-screen">
        <!-- Замените 'bcblogo.png' на путь к вашему логотипу -->
        <img src="bcblogo.png" alt="BCB Logo" class="loading-logo">
        <p class="loading-text">Загрузка BCB...</p>
    </div>

    <!-- Основной интерфейс приложения -->
    <div id="app-interface">
        <header>
            <h1>Добро пожаловать в BCB!</h1>
        </header>
        <main>
            <p>Ваше виртуальное казино готово к игре.</p>
            <!-- Здесь будет ваш игровой контент: кнопки, баланс, слоты и т.д. -->
        </main>
    </div>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;

        // Сообщаем Telegram, что приложение готово
        tg.ready();
        
        // Расширяем приложение на весь экран
        tg.expand();

        // Получаем элементы DOM
        const loadingScreen = document.getElementById('loading-screen');
        const appInterface = document.getElementById('app-interface');

        // Функция для имитации загрузки и перехода к интерфейсу
        function startApp() {
            // Время загрузки в миллисекундах (например, 2.5 секунды)
            const loadingDuration = 2500;

            setTimeout(() => {
                // Добавляем класс для плавного исчезновения
                loadingScreen.classList.add('fade-out');

                // После завершения анимации исчезновения (0.5s) переключаем видимость
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    appInterface.style.display = 'block';
                    
                    // Опционально: устанавливаем цвет хедера Telegram под тему приложения
                    // Используем темный бордовый цвет из градиента
                    tg.setHeaderColor('#4a0e2d'); 
                    
                }, 500); // Это время должно совпадать с duration в CSS .fade-out

            }, loadingDuration);
        }

        // Запускаем процесс при загрузке страницы
        window.onload = startApp;
    </script>
</body>
</html>
