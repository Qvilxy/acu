
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Job Finder TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Иконки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #0f0f0f;
            --text-main: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-gradient: linear-gradient(90deg, #8A2BE2, #00BFFF);
            --glow-shadow: 0 0 10px rgba(255, 255, 255, 0.15), inset 0 0 5px rgba(255, 255, 255, 0.05);
            --nav-height: 70px;
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: calc(var(--nav-height) + var(--safe-area-bottom) + 20px);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Утилиты --- */
        .hidden { display: none !important; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .btn { border: none; outline: none; cursor: pointer; transition: 0.2s; }
        
        /* --- Навигация (Таблетка) --- */
        .bottom-nav {
            position: fixed;
            bottom: calc(20px + var(--safe-area-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: var(--nav-height);
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 10px;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active { color: var(--text-main); }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }

        /* --- Карточки (Таблетки) --- */
        .pill-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            margin: 12px 16px;
            box-shadow: var(--glow-shadow);
            position: relative;
            transition: transform 0.1s;
        }
        .pill-card:active { transform: scale(0.98); }

        /* --- Вкладка 1: Главная --- */
        .job-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .job-title { font-weight: 600; font-size: 16px; max-width: 70%; }
        .job-price { font-weight: 700; color: var(--text-main); white-space: nowrap; }
        .job-date { font-size: 12px; color: var(--text-secondary); }

        /* --- Модальные окна --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000;
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        
        .modal-content {
            background: #1a1a1a;
            width: 100%;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.open .modal-content { transform: translateY(0); }

        /* --- Элементы форм --- */
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; color: var(--text-secondary); margin-bottom: 6px; font-size: 13px; }
        .form-input {
            width: 100%; background: #252525; border: 1px solid #333;
            color: white; padding: 12px; border-radius: 12px; font-size: 15px; outline: none;
        }
        .form-input:focus { border-color: #8A2BE2; }
        
        .gradient-btn {
            width: 100%; padding: 16px; border-radius: 16px;
            background: var(--accent-gradient); color: white;
            font-weight: 700; font-size: 16px; margin-top: 10px;
        }

        /* --- Профиль и Звезды --- */
        .profile-header { text-align: center; padding: 30px 0; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); }
        .stars-container { display: flex; gap: 4px; justify-content: center; margin: 8px 0; }
        .star { color: #444; font-size: 18px; cursor: pointer; }
        .star.filled { color: #FFD700; }
        
        /* --- Капча --- */
        .captcha-widget { text-align: center; padding: 20px; }
        .captcha-question { font-size: 24px; margin: 20px 0; font-weight: bold; letter-spacing: 2px; }

        /* --- Счетчик символов --- */
        .char-counter { text-align: right; font-size: 12px; margin-top: 4px; color: #555; transition: color 0.3s; }
        .char-counter.valid { color: #4CAF50; }
        .char-counter.invalid { color: #F44336; }

        /* --- Кнопки управления объявлением --- */
        .manage-btn {
            position: absolute; top: 12px; right: 12px;
            width: 32px; height: 32px; border-radius: 50%;
            background: #252525; display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }
        .manage-menu {
            position: absolute; top: 48px; right: 16px;
            background: #252525; border-radius: 12px; padding: 8px;
            display: flex; gap: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 11;
        }
        .action-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .action-edit { background: rgba(255,255,255,0.1); color: white; }
        .action-delete { background: rgba(244,67,54,0.2); color: #F44336; }

        /* --- Отзыв --- */
        .review-pill { display: flex; gap: 12px; align-items: flex-start; }
        .review-content { flex: 1; }
        .review-text { font-size: 14px; line-height: 1.4; margin-top: 6px; color: #ddd; }

        /* --- Детали задания --- */
        .job-detail-price { font-size: 24px; font-weight: 700; margin: 10px 0; }
        .job-detail-desc { color: #ccc; line-height: 1.5; margin-bottom: 20px; white-space: pre-wrap; }
        .user-pill {
            display: flex; align-items: center; justify-content: space-between;
            background: #1f1f1f; padding: 10px; border-radius: 16px; margin-top: 20px;
            box-shadow: var(--glow-shadow);
        }
        .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .user-info .avatar { width: 40px; height: 40px; }
        .contact-btn {
            background: var(--accent-gradient); padding: 8px 16px;
            border-radius: 12px; font-size: 13px; font-weight: 600; color: white;
        }

    </style>
</head>
<body>

    <!-- === ВКЛАДКА 1: ГЛАВНАЯ === -->
    <div id="tab-home" class="tab-content">
        <h2 style="padding: 20px 16px 0;">Задания</h2>
        <div id="jobs-list"></div>
    </div>

    <!-- === ВКЛАДКА 2: СОЗДАТЬ ЗАДАНИЕ === -->
    <div id="tab-create" class="tab-content hidden">
        <h2 style="padding: 20px 16px;">Новое задание</h2>
        <div style="padding: 0 16px;">
            <div class="input-group">
                <label>Название</label>
                <input type="text" id="create-title" class="form-input" placeholder="Например: Выгулять собаку">
            </div>
            <div class="input-group">
                <label>Описание</label>
                <textarea id="create-desc" class="form-input" rows="4" placeholder="Подробности..."></textarea>
            </div>
            <div class="input-group">
                <label>Цена (₽)</label>
                <input type="number" id="create-price" class="form-input" placeholder="1000">
            </div>
            <div class="input-group">
                <label>Дата и время</label>
                <input type="datetime-local" id="create-date" class="form-input">
            </div>
            <!-- Отступ для кнопки над меню -->
            <div style="height: 80px;"></div>
        </div>
        <div style="position: fixed; bottom: calc(var(--nav-height) + var(--safe-area-bottom) + 20px); left: 0; width: 100%; padding: 0 16px; z-index: 900;">
            <button class="gradient-btn" onclick="app.createJob()">Создать объявление</button>
        </div>
    </div>

    <!-- === ВКЛАДКА 3: ПРОФИЛЬ === -->
    <div id="tab-profile" class="tab-content hidden">
        <div class="profile-header">
            <img id="my-avatar" src="" class="avatar">
            <h3 id="my-nick" style="margin-top: 10px;">Username</h3>
            <div id="my-stars" class="stars-container"></div>
            <p style="color: var(--text-secondary); font-size: 13px; margin-top: 4px;">Мои отзывы</p>
        </div>
        <h3 style="padding: 0 16px; margin-bottom: 10px;">Мои объявления</h3>
        <div id="my-jobs-list"></div>
    </div>

    <!-- === НИЖНЕЕ МЕНЮ === -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="app.switchTab('home')">
            <i class="fa-solid fa-house"></i>
            <span>Главная</span>
        </div>
        <div class="nav-item" onclick="app.switchTab('create')">
            <i class="fa-solid fa-plus-circle"></i>
            <span>Создать</span>
        </div>
        <div class="nav-item" onclick="app.switchTab('profile')">
            <i class="fa-solid fa-user"></i>
            <span>Профиль</span>
        </div>
    </nav>

    <!-- === МОДАЛКА: ДЕТАЛИ ЗАДАНИЯ === -->
    <div id="modal-job-detail" class="modal-overlay" onclick="if(event.target===this) this.classList.remove('open')">
        <div class="modal-content">
            <h2 id="detail-title"></h2>
            <div id="detail-price" class="job-detail-price"></div>
            <p id="detail-desc" class="job-detail-desc"></p>
            <p id="detail-date" style="color: var(--text-secondary); font-size: 13px;"></p>
            
            <div class="user-pill">
                <div class="user-info" id="detail-user-click">
                    <img id="detail-avatar" src="" class="avatar">
                    <div>
                        <div id="detail-username" style="font-weight: 600; font-size: 14px;"></div>
                        <div id="detail-rating" style="font-size: 11px; color: #FFD700;"></div>
                    </div>
                </div>
                <button class="contact-btn" id="detail-contact-btn">Написать</button>
            </div>
        </div>
    </div>

    <!-- === МОДАЛКА: ПРОФИЛЬ ДРУГОГО ПОЛЬЗОВАТЕЛЯ === -->
    <div id="modal-user-profile" class="modal-overlay" onclick="if(event.target===this) this.classList.remove('open')">
        <div class="modal-content">
            <div class="profile-header">
                <img id="profile-avatar" src="" class="avatar">
                <h3 id="profile-nick" style="margin-top: 10px;"></h3>
                <div id="profile-stars" class="stars-container"></div>
                <button class="gradient-btn" style="margin-top: 15px; padding: 10px;" onclick="app.startReviewProcess()">Оставить отзыв</button>
            </div>
            <h3 style="margin-bottom: 10px;">Отзывы</h3>
            <div id="profile-reviews-list"></div>
        </div>
    </div>

    <!-- === МОДАЛКА: КАПЧА === -->
    <div id="modal-captcha" class="modal-overlay">
        <div class="modal-content captcha-widget">
            <h3>Проверка</h3>
            <p style="color: var(--text-secondary); margin-top: 5px;">Решите пример, чтобы оставить отзыв</p>
            <div id="captcha-question" class="captcha-question"></div>
            <input type="number" id="captcha-answer" class="form-input" style="text-align: center; font-size: 20px;">
            <button class="gradient-btn" onclick="app.verifyCaptcha()">Проверить</button>
        </div>
    </div>

    <!-- === МОДАЛКА: ФОРМА ОТЗЫВА === -->
    <div id="modal-review-form" class="modal-overlay" onclick="if(event.target===this) this.classList.remove('open')">
        <div class="modal-content">
            <h3 style="text-align: center; margin-bottom: 15px;">Ваш отзыв</h3>
            <div id="review-stars-input" class="stars-container" style="margin-bottom: 15px;"></div>
            <textarea id="review-text" class="form-input" rows="4" placeholder="Напишите отзыв (15-100 символов)" oninput="app.updateCharCounter()"></textarea>
            <div id="char-counter" class="char-counter">0/150</div>
            <button class="gradient-btn" onclick="app.submitReview()">Отправить</button>
        </div>
    </div>

    <script>
        // --- MOCK DATA & STATE ---
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Текущий пользователь (из ТГ или заглушка)
        const currentUser = {
            id: tg.initDataUnsafe?.user?.id || 12345,
            username: tg.initDataUnsafe?.user?.username || "User",
            avatar: tg.initDataUnsafe?.user?.photo_url || "https://via.placeholder.com/80",
            rating: 4.8
        };

        // Хранилище данных (в реальном приложении - Backend)
        let db = {
            jobs: [
                { id: 1, userId: 99, title: "Помочь с переездом", desc: "Нужно спустить диван с 3 этажа без лифта.", price: 2500, date: "2026-08-12T14:00", user: { name: "Alex_Builder", avatar: "https://via.placeholder.com/80/333", rating: 4.5 } },
                { id: 2, userId: 88, title: "Выгул корги", desc: "Ищем няню для корги на 2 часа вечером.", price: 800, date: "2026-08-11T18:00", user: { name: "DogLover", avatar: "https://via.placeholder.com/80/444", rating: 5.0 } },
                { id: 3, userId: 77, title: "Настроить принтер", desc: "HP не печатает, мигает красным.", price: 1000, date: "2026-08-10T12:00", user: { name: "TechGuy", avatar: "https://via.placeholder.com/80/555", rating: 3.2 } }
            ],
            reviews: [
                { id: 1, targetUserId: 12345, author: "ClientOne", avatar: "https://via.placeholder.com/40", stars: 5, text: "Отличная работа, все сделано быстро!" },
                { id: 2, targetUserId: 12345, author: "ClientTwo", avatar: "https://via.placeholder.com/40", stars: 4, text: "Хорошо, но немного опоздал." }
            ]
        };

        let currentViewingUserId = null;
        let captchaResult = 0;
        let selectedReviewStars = 0;

        // --- APP LOGIC ---
        const app = {
            init: () => {
                // Установка данных текущего пользователя
                document.getElementById('my-avatar').src = currentUser.avatar;
                document.getElementById('my-nick').innerText = `@${currentUser.username}`;
                app.renderStars('my-stars', currentUser.rating, false);
                
                app.renderJobs();
                app.renderMyJobs();
                
                // Слушатели
                document.getElementById('detail-contact-btn').addEventListener('click', app.contactUser);
                document.getElementById('detail-user-click').addEventListener('click', () => {
                    const job = db.jobs.find(j => j.id == document.getElementById('modal-job-detail').dataset.jobId);
                    if(job) app.openUserProfile(job.userId, job.user);
                });
            },

            switchTab: (tabName) => {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
                document.getElementById(`tab-${tabName}`).classList.remove('hidden');
                
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                event.currentTarget.classList.add('active');

                if(tabName === 'home') app.renderJobs();
                if(tabName === 'profile') app.renderMyJobs();
            },

            // Рендер звезд
            renderStars: (containerId, rating, interactive = false, onClick = null) => {
                const container = document.getElementById(containerId);
                container.innerHTML = '';
                for(let i=1; i<=5; i++) {
                    const star = document.createElement('i');
                    star.className = `fa-solid fa-star star ${i <= Math.round(rating) ? 'filled' : ''}`;
                    if(interactive) {
                        star.onclick = () => onClick(i);
                    } else {
                        // Для просмотра профиля другого юзера - открытие отзывов
                        if(!interactive && containerId === 'profile-stars') {
                            star.style.cursor = 'default'; 
                        }
                    }
                    container.appendChild(star);
                }
            },

            // Рендер списка заданий (Главная)
            renderJobs: () => {
                const list = document.getElementById('jobs-list');
                list.innerHTML = '';
                // Перемешивание массива
                const shuffled = [...db.jobs].sort(() => 0.5 - Math.random());
                
                shuffled.forEach(job => {
                    const dateObj = new Date(job.date);
                    const dateStr = dateObj.toLocaleDateString('ru-RU') + ' ' + dateObj.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
                    
                    const card = document.createElement('div');
                    card.className = 'pill-card';
                    card.innerHTML = `
                        <div class="job-header">
                            <div class="job-title">${job.title}</div>
                            <div class="job-price">${job.price}₽</div>
                        </div>
                        <div class="job-date">${dateStr}</div>
                    `;
                    card.onclick = () => app.openJobDetail(job);
                    list.appendChild(card);
                });
            },

            // Создание задания
            createJob: () => {
                const title = document.getElementById('create-title').value;
                const desc = document.getElementById('create-desc').value;
                const price = document.getElementById('create-price').value;
                const date = document.getElementById('create-date').value;

                if(!title || !desc || !price || !date) {
                    tg.showAlert("Заполните все поля!");
                    return;
                }

                const newJob = {
                    id: Date.now(),
                    userId: currentUser.id,
                    title, desc, price, date,
                    user: { name: currentUser.username, avatar: currentUser.avatar, rating: currentUser.rating }
                };

                db.jobs.push(newJob);
                
                // Очистка формы
                document.getElementById('create-title').value = '';
                document.getElementById('create-desc').value = '';
                document.getElementById('create-price').value = '';
                document.getElementById('create-date').value = '';
                
                tg.showPopup({ message: "Объявление создано!" });
                app.switchTab('home');
            },

            // Открытие деталей задания
            openJobDetail: (job) => {
                const modal = document.getElementById('modal-job-detail');
                modal.dataset.jobId = job.id;
                
                document.getElementById('detail-title').innerText = job.title;
                document.getElementById('detail-price').innerText = `${job.price}₽`;
                document.getElementById('detail-desc').innerText = job.desc;
                
                const dateObj = new Date(job.date);
                document.getElementById('detail-date').innerText = `📅 ${dateObj.toLocaleDateString('ru-RU')} в ${dateObj.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}`;
                
                document.getElementById('detail-avatar').src = job.user.avatar;
                document.getElementById('detail-username').innerText = `@${job.user.name}`;
                document.getElementById('detail-rating').innerHTML = `★ ${job.user.rating}`;
                
                // Сохраняем ссылку для кнопки "Написать"
                modal.dataset.tgLink = `https://t.me/${job.user.name}`;
                modal.dataset.jobTitle = job.title;
                
                modal.classList.add('open');
            },

            contactUser: () => {
                const modal = document.getElementById('modal-job-detail');
                const link = modal.dataset.tgLink;
                const jobTitle = modal.dataset.jobTitle;
                const text = encodeURIComponent(`Здравствуйте! Я по поводу работы - «${jobTitle}»`);
                
                // В TMA используем tg.openTelegramLink или window.open
                const fullLink = `${link}?text=${text}`;
                tg.openTelegramLink(fullLink);
            },

            // Открытие профиля пользователя
            openUserProfile: (userId, userData) => {
                currentViewingUserId = userId;
                document.getElementById('modal-job-detail').classList.remove('open');
                
                const modal = document.getElementById('modal-user-profile');
                document.getElementById('profile-avatar').src = userData.avatar;
                document.getElementById('profile-nick').innerText = `@${userData.name}`;
                
                app.renderStars('profile-stars', userData.rating);
                
                // Рендер отзывов
                const reviewsList = document.getElementById('profile-reviews-list');
                reviewsList.innerHTML = '';
                const userReviews = db.reviews.filter(r => r.targetUserId === userId);
                
                if(userReviews.length === 0) {
                    reviewsList.innerHTML = '<p style="color:#555; text-align:center; padding:20px;">Нет отзывов</p>';
                } else {
                    userReviews.forEach(rev => {
                        let starsHtml = '';
                        for(let i=0; i<rev.stars; i++) starsHtml += '<i class="fa-solid fa-star" style="color:#FFD700; font-size:10px;"></i>';
                        
                        const pill = document.createElement('div');
                        pill.className = 'pill-card review-pill';
                        pill.innerHTML = `
                            <img src="${rev.avatar}" class="avatar" style="width:40px; height:40px;">
                            <div class="review-content">
                                <div style="font-weight:600; font-size:13px;">@${rev.author}</div>
                                <div style="margin: 2px 0;">${starsHtml}</div>
                                <div class="review-text">${rev.text}</div>
                            </div>
                        `;
                        reviewsList.appendChild(pill);
                    });
                }
                
                modal.classList.add('open');
            },

            // Процесс оставления отзыва
            startReviewProcess: () => {
                // Генерация капчи
                const a = Math.floor(Math.random() * 10) + 1;
                const b = Math.floor(Math.random() * 10) + 1;
                captchaResult = a + b;
                document.getElementById('captcha-question').innerText = `${a} + ${b} = ?`;
                document.getElementById('captcha-answer').value = '';
                
                document.getElementById('modal-captcha').classList.add('open');
            },

            verifyCaptcha: () => {
                const val = parseInt(document.getElementById('captcha-answer').value);
                if(val === captchaResult) {
                    document.getElementById('modal-captcha').classList.remove('open');
                    // Открыть форму отзыва
                    selectedReviewStars = 0;
                    document.getElementById('review-text').value = '';
                    app.updateCharCounter();
                    app.renderStars('review-stars-input', 0, true, (n) => {
                        selectedReviewStars = n;
                        app.renderStars('review-stars-input', n, true, arguments.callee); // перерисовка
                    });
                    document.getElementById('modal-review-form').classList.add('open');
                } else {
                    tg.showAlert("Неверный ответ!");
                }
            },

            updateCharCounter: () => {
                const txt = document.getElementById('review-text').value;
                const len = txt.length;
                const counter = document.getElementById('char-counter');
                counter.innerText = `${len}/150`;
                
                counter.classList.remove('valid', 'invalid');
                if(len === 0) counter.style.color = '#555';
                else if(len >= 15 && len <= 100) counter.classList.add('valid');
                else counter.classList.add('invalid');
            },

            submitReview: () => {
                const txt = document.getElementById('review-text').value;
                if(selectedReviewStars === 0) { tg.showAlert("Выберите количество звезд!"); return; }
                if(txt.length < 15 || txt.length > 100) { tg.showAlert("Отзыв должен быть от 15 до 100 символов!"); return; }

                db.reviews.push({
                    id: Date.now(),
                    targetUserId: currentViewingUserId,
                    author: currentUser.username,
                    avatar: currentUser.avatar,
                    stars: selectedReviewStars,
                    text: txt
                });

                tg.showPopup({ message: "Спасибо за отзыв!" });
                document.getElementById('modal-review-form').classList.remove('open');
                // Обновляем список отзывов в открытом профиле
                app.openUserProfile(currentViewingUserId, { 
                    name: document.getElementById('profile-nick').innerText.replace('@',''), 
                    avatar: document.getElementById('profile-avatar').src,
                    rating: 0 // Рейтинг пересчитается на бэкенде
                });
            },

            // Рендер моих объявлений
            renderMyJobs: () => {
                const list = document.getElementById('my-jobs-list');
                list.innerHTML = '';
                const myJobs = db.jobs.filter(j => j.userId === currentUser.id);
                
                if(myJobs.length === 0) {
                    list.innerHTML = '<p style="color:#555; text-align:center; padding:20px;">У вас пока нет объявлений</p>';
                    return;
                }

                myJobs.forEach(job => {
                    const card = document.createElement('div');
                    card.className = 'pill-card';
                    card.innerHTML = `
                        <div class="manage-btn" onclick="event.stopPropagation(); this.nextElementSibling.classList.toggle('hidden')">
                            <i class="fa-solid fa-gear" style="color:white;"></i>
                        </div>
                        <div class="manage-menu hidden">
                            <div class="action-icon action-edit" onclick="event.stopPropagation(); app.editJob(${job.id})"><i class="fa-solid fa-pencil"></i></div>
                            <div class="action-icon action-delete" onclick="event.stopPropagation(); app.deleteJob(${job.id})"><i class="fa-solid fa-trash"></i></div>
                        </div>
                        <div class="job-header">
                            <div class="job-title">${job.title}</div>
                            <div class="job-price">${job.price}₽</div>
                        </div>
                        <div class="job-date">${new Date(job.date).toLocaleDateString()}</div>
                    `;
                    list.appendChild(card);
                });
            },

            editJob: (id) => {
                const job = db.jobs.find(j => j.id === id);
                if(!job) return;
                
                // Переключаем на вкладку создания и заполняем поля
                app.switchTab('create');
                document.getElementById('create-title').value = job.title;
                document.getElementById('create-desc').value = job.desc;
                document.getElementById('create-price').value = job.price;
                document.getElementById('create-date').value = job.date;
                
                // Меняем логику кнопки (упрощено: удаляем старое и создаем новое с тем же ID)
                const btn = document.querySelector('#tab-create .gradient-btn');
                btn.innerText = "Сохранить изменения";
                btn.onclick = () => {
                    job.title = document.getElementById('create-title').value;
                    job.desc = document.getElementById('create-desc').value;
                    job.price = document.getElementById('create-price').value;
                    job.date = document.getElementById('create-date').value;
                    
                    btn.innerText = "Создать объявление";
                    btn.onclick = () => app.createJob();
                    tg.showPopup({ message: "Изменения сохранены!" });
                    app.switchTab('profile');
                };
            },

            deleteJob: (id) => {
                tg.showConfirm({ message: "Удалить это объявление?" }, (confirmed) => {
                    if(confirmed) {
                        db.jobs = db.jobs.filter(j => j.id !== id);
                        app.renderMyJobs();
                    }
                });
            }
        };

        // Запуск
        app.init();

    </script>
</body>
</html>
