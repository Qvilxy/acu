<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BCB Casino</title>
    
    <!-- Подключаем скрипт Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* --- Базовые стили --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #4a0e2d, #7b1f4c);
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Экран загрузки --- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            background: linear-gradient(135deg, #4a0e2d, #7b1f4c);
            transition: opacity 0.6s ease-out, visibility 0.6s;
        }

        #loading-screen.loaded {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-logo {
            width: 50%;
            max-width: 250px;
            height: auto;
            object-fit: contain;
        }

        /* --- ШАПКА ПРИЛОЖЕНИЯ --- */
        header {
            height: 120px; 
            padding-top: env(safe-area-inset-top, 20px); 
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent; 
            flex-shrink: 0;
            z-index: 10;
            width: 100%;
            position: relative; 
        }

        .header-logo {
            max-height: 80px; 
            width: auto;
            max-width: 90%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        /* --- БАЛАНС (КОМПАКТНЫЙ) --- */
        .balance-pill {
            position: absolute;
            top: calc(env(safe-area-inset-top, 20px) + 52px); 
            right: 16px; 
            
            display: flex;
            align-items: center;
            justify-content: center;
            
            height: 26px; 
            min-width: 52px; 
            width: auto; 
            padding: 0 8px; 
            gap: 4px; 
            
            background: linear-gradient(180deg, #FCD34D 0%, #F59E0B 100%);
            border-radius: 13px; 
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            
            z-index: 20;
            transition: width 0.2s ease, opacity 0.3s ease, transform 0.3s ease;
        }

        .balance-pill.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
        }

        .balance-text {
            font-size: 14px; 
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            line-height: 1;
            white-space: nowrap; 
        }

        .balance-star-img {
            height: 27px; 
            width: auto;
            object-fit: contain;
            display: block;
        }

        /* --- Основной контент --- */
        main {
            flex-grow: 1;
            position: relative;
            overflow-y: auto;
            width: 100%;
            height: 100%;
        }

        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Вкладка "Рефералы" */
        .dev-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.2em;
            font-weight: 500;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* --- ВКЛАДКА ИГРАТЬ (СЛАЙДЕР РЕЖИМОВ) --- */
        #tab-play {
            display: none;
            flex-direction: column;
            align-items: center;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        
        #tab-play.active {
            display: flex;
        }

        /* Контейнер для списка игр и ползунка */
        .games-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        /* Область с карточками (СКРОЛЛИТСЯ) */
        .games-list {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            /* УБРАЛ PADDING, ДОБАВИЛ MARGIN ЧЕРЕЗ СПЕЙСЕРЫ НИЖЕ */
            padding: 0 20px; 
            overflow-y: scroll;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
            touch-action: pan-y;
            height: 100%;
            /* Важно: убираем дефолтное выравнивание, будем центрировать через JS и спейсеры */
            align-items: stretch; 
        }
        
        .games-list::-webkit-scrollbar {
            display: none;
        }

        /* Спейсеры для бесконечного скролла (вместо padding) */
        .scroll-spacer {
            width: 100%;
            flex-shrink: 0;
            /* Высота будет задана через JS, чтобы быть ровно половиной экрана минус половина карточки */
        }

        /* Общий стиль карточки игры */
        .game-card {
            background: #2A2A2A;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); /* Чуть быстрее анимация */
            position: relative;
            flex-shrink: 0;
            will-change: transform, height, opacity;
            
            /* По умолчанию маленькая */
            height: 120px;
            opacity: 0.5;
            transform: scale(0.9);
            filter: brightness(0.7);
            z-index: 1;
        }

        /* Иконка замка */
        .lock-icon {
            width: 60px;
            height: 60px;
            fill: white;
            opacity: 0.8;
        }

        /* БОЛЬШАЯ КАРТОЧКА (Квадрат) */
        .game-card.large {
            /* Используем aspect-ratio, теперь он работает т.к. нет padding у родителя */
            aspect-ratio: 1 / 1; 
            width: 100%;
            transform: scale(1);
            opacity: 1;
            z-index: 2;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            filter: brightness(1);
        }

        /* ПОЛЗУНОК СПРАВА */
        .scroll-track-container {
            width: 20px;
            height: 100%;
            position: absolute;
            right: 0;
            top: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .scroll-track {
            width: 4px;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: relative;
        }

        /* Активный индикатор */
        .track-indicator {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #FCD34D;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(252, 211, 77, 0.8);
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), height 0.2s ease, border-radius 0.2s ease;
            z-index: 2;
        }
        
        .track-indicator.stretching {
            height: 40px;
            border-radius: 10px;
            background: #F59E0B;
        }


        /* Стили для вкладки "Профиль" */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Прижимаем к верху */
            padding-top: 40px;
            height: 100%;
            gap: 15px;
        }

        .user-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.15);
            object-fit: cover;
            background-color: rgba(0, 0, 0, 0.2);
            box-shadow: none; 
            margin-bottom: 5px;
        }

        .user-name-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1; 
        }

        .user-name {
            font-size: 1.6em;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: none; 
            margin-bottom: 4px; 
        }

        .user-username {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            margin-top: 0; 
            padding-top: 0;
        }

        /* --- ПАРЯЩЕЕ МЕНЮ --- */
        nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 420px;
            height: 70px;
            
            background: #3a0b22; 
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px;
            z-index: 1000;
            overflow: hidden;
            
            touch-action: none; 
            -webkit-touch-callout: none;
        }

        .nav-track {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .nav-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #8E8E93;
            transition: color 0.3s;
            position: relative;
            z-index: 2;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            fill: currentColor;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .nav-item.active-text {
            color: #F2F2F7;
        }

        /* Анимации иконок */
        .nav-item.active-text svg.icon-chain { animation: stretchChain 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes stretchChain { 0% { transform: scaleX(1); } 40% { transform: scaleX(1.6); } 100% { transform: scaleX(1); } }

        .nav-item.active-text svg.icon-gamepad { animation: pressGamepad 0.4s ease-in-out; }
        @keyframes pressGamepad { 0% { transform: scaleX(1) scaleY(1); } 25% { transform: scaleX(0.85) scaleY(1.1) translateX(2px); } 50% { transform: scaleX(1) scaleY(1); } 75% { transform: scaleX(0.85) scaleY(1.1) translateX(-2px); } 100% { transform: scaleX(1) scaleY(1); } }

        .nav-item.active-text svg.icon-profile { animation: pulseProfile 0.4s ease-in-out; }
        @keyframes pulseProfile { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* --- ИНДИКАТОР МЕНЮ (ПЛИТКА) --- */
        .glass-pill {
            position: absolute;
            top: 6px;
            left: 6px;
            width: var(--pill-width, calc((100% - 12px) / 3)); 
            height: calc(100% - 12px);
            border-radius: 32px;
            z-index: 1;
            
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            
            will-change: transform;
            
            transform: translateX(var(--tx, 0px)) scale(var(--scale, 1));
            
            transition: 
                background 0.3s ease,
                border-color 0.3s ease, 
                box-shadow 0.3s ease; 
        }

        .glass-pill.dragging,
        .glass-pill.animating {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .glass-pill.dragging {
            transition: none !important;
        }

    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loading-screen">
        <img src="bcblogo.PNG" alt="BCB Logo" class="loading-logo" onerror="this.style.display='none'">
    </div>

    <!-- Шапка -->
    <header>
        <img src="bcblogotext.PNG" alt="BCB Text Logo" class="header-logo" onerror="this.style.display='none'">
        
        <!-- Таблетка баланса -->
        <div class="balance-pill" id="balance-pill">
            <span class="balance-text">0</span>
            <img src="iconcherry.PNG" alt="" class="balance-star-img" onerror="this.style.display='none'">
        </div>
    </header>

    <!-- Контент -->
    <main>
        <!-- Вкладка 1: Рефералы -->
        <div id="tab-dev" class="tab-content">
            <div class="dev-placeholder">
                <p>Раздел в разработке</p>
            </div>
        </div>

        <!-- Вкладка 2: Играть (Слайдер режимов) -->
        <div id="tab-play" class="tab-content active">
            <div class="games-wrapper">
                <!-- Список игр (СКРОЛЛИТСЯ) -->
                <div class="games-list" id="games-list">
                    <!-- Карточки генерируются JS -->
                </div>

                <!-- Ползунок справа -->
                <div class="scroll-track-container">
                    <div class="scroll-track">
                        <div class="track-indicator" id="track-indicator"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Вкладка 3: Профиль -->
        <div id="tab-profile" class="tab-content">
            <div class="profile-container">
                <img id="profile-avatar" src="" alt="Avatar" class="user-avatar">
                
                <div class="user-name-wrapper">
                    <div id="profile-name" class="user-name">Загрузка...</div>
                    <div id="profile-username" class="user-username">@...</div>
                </div>
                
            </div>
        </div>
    </main>

    <!-- Меню навигации -->
    <nav id="nav-bar">
        <!-- Плавающая плитка -->
        <div class="glass-pill" id="active-pill"></div>

        <!-- Трек с кнопками -->
        <div class="nav-track">
            <!-- Вкладка 1: РЕФЕРАЛЫ -->
            <div class="nav-item" data-target="tab-dev" data-index="0">
                <svg class="icon-chain" viewBox="0 0 24 24">
                    <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
                </svg>
                <span>Рефералы</span>
            </div>
            
            <!-- Вкладка 2: Играть -->
            <div class="nav-item active-text" data-target="tab-play" data-index="1">
                <svg class="icon-gamepad" viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                <span>Играть</span>
            </div>
            
            <!-- Вкладка 3: Профиль -->
            <div class="nav-item" data-target="tab-profile" data-index="2">
                <svg class="icon-profile" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Профиль</span>
            </div>
        </div>
    </nav>

    <script>
        // --- 1. БЕЗОПАСНАЯ ИНИЦИАЛИЗАЦИЯ TELEGRAM WEBAPP ---
        const tg = window.Telegram?.WebApp || null;
        
        if (tg) {
            try {
                tg.ready();
                tg.expand();
                tg.setHeaderColor('#4a0e2d');
                tg.setBackgroundColor('#4a0e2d');
            } catch (e) {
                console.warn('Telegram WebApp init error:', e);
            }
        }

        // --- 2. ДАННЫЕ ПОЛЬЗОВАТЕЛЯ ---
        const user = tg?.initDataUnsafe?.user || {};
        const avatarImg = document.getElementById('profile-avatar');
        const nameDiv = document.getElementById('profile-name');
        const usernameDiv = document.getElementById('profile-username');

        if (user.photo_url) {
            avatarImg.src = user.photo_url;
        } else {
            avatarImg.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjIpIj48cGF0aCBkPSJNMTIgMTJjMi4yMSAwIDQtMS43OSA0LTRzLTEuNzktNC00LTRzLTQgMS43OS00IDRTOS43OSAxMiAxMiAxMnogTTEyIDE0Yy0yLjY3IDAtOCAxLjM0LTggNHYyaDE2di0yQzIwIDE1LjM0IDE0LjY3IDE0IDEyIDE0eiIvPjwvc3ZnPg==';
        }
        
        nameDiv.textContent = user.first_name + (user.last_name ? ' ' + user.last_name : '') || 'Игрок BCB';
        usernameDiv.textContent = user.username ? '@' + user.username : 'Нет юзернейма';

        // --- 3. ЛОГИКА ЗАГРУЗКИ ---
        const loadingScreen = document.getElementById('loading-screen');
        
        setTimeout(() => {
            loadingScreen.classList.add('loaded');
            setTimeout(() => { 
                if(loadingScreen) loadingScreen.remove(); 
            }, 600);
        }, 2000);

        // --- 4. ФИЗИКА МЕНЮ И DRAG-AND-DROP ---
        const navBar = document.getElementById('nav-bar');
        const pill = document.getElementById('active-pill');
        const balancePill = document.getElementById('balance-pill'); 
        const navItems = document.querySelectorAll('.nav-item');
        const tabContents = document.querySelectorAll('.tab-content');

        let currentIndex = 1; 
        let isDragging = false;
        let startX = 0;
        let currentTranslateX = 0; 
        
        function getStepWidth() { 
            return navBar ? (navBar.offsetWidth - 12) / 3 : 100; 
        }

        function updatePillPosition(index, animate = true) {
            if (!pill || !navBar) return;
            
            const step = getStepWidth();
            const xPos = index * step; 
            
            pill.style.setProperty('--pill-width', `${step}px`);
            
            if (isDragging) {
                pill.classList.add('dragging');
                pill.classList.remove('animating');
            } else if (!animate) {
                pill.classList.remove('dragging', 'animating');
                pill.style.transition = 'none';
            } else {
                pill.classList.remove('dragging');
                pill.classList.add('animating');
                
                pill.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease';
                
                setTimeout(() => {
                    if (!isDragging) pill.classList.remove('animating');
                }, 500);
            }
            
            pill.style.setProperty('--tx', `${xPos}px`);
            pill.style.setProperty('--scale', isDragging ? 1.1 : 1);
            
            currentTranslateX = xPos;
        }

        function toggleBalanceVisibility(index) {
            if (!balancePill) return;
            if (index === 1) {
                balancePill.classList.remove('hidden');
            } else {
                balancePill.classList.add('hidden');
            }
        }

        setTimeout(() => {
            updatePillPosition(currentIndex, false);
            toggleBalanceVisibility(currentIndex);
        }, 2100);

        const startDragNav = (clientX) => {
            isDragging = true;
            startX = clientX - currentTranslateX;
            pill.classList.add('dragging');
            pill.style.setProperty('--scale', 1.1);
            if(tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        };

        const moveDragNav = (clientX) => {
            if (!isDragging) return;
            
            let newX = clientX - startX;
            const step = getStepWidth();
            const maxIndex = 2;
            
            const limit = step * 0.4; 
            if (newX < -limit) newX = -limit + (newX + limit) * 0.2;
            if (newX > (maxIndex * step) + limit) newX = (maxIndex * step) + limit + (newX - ((maxIndex * step) + limit)) * 0.2;

            pill.style.setProperty('--tx', `${newX}px`);
            currentTranslateX = newX;
        };

        const endDragNav = () => {
            if (!isDragging) return;
            isDragging = false;
            pill.classList.remove('dragging');
            
            const step = getStepWidth();
            let newIndex = Math.round(currentTranslateX / step);
            
            if (newIndex < 0) newIndex = 0;
            if (newIndex > 2) newIndex = 2;

            if (newIndex !== currentIndex) {
                switchTab(newIndex);
            }

            updatePillPosition(newIndex, true);
            
            if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        };

        if(navBar) {
            navBar.addEventListener('touchstart', (e) => startDragNav(e.touches[0].clientX), {passive: false});
        }
        window.addEventListener('touchmove', (e) => {
            if(isDragging) {
                e.preventDefault(); 
                moveDragNav(e.touches[0].clientX);
            }
        }, {passive: false});
        window.addEventListener('touchend', endDragNav);

        if(navBar) {
            navBar.addEventListener('mousedown', (e) => startDragNav(e.clientX));
        }
        window.addEventListener('mousemove', (e) => moveDragNav(e.clientX));
        window.addEventListener('mouseup', endDragNav);

        navItems.forEach((item, index) => {
            item.addEventListener('click', () => {
                if (!isDragging && index !== currentIndex) {
                    switchTab(index);
                    updatePillPosition(index, true);
                    if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                }
            });
        });

        function switchTab(newIndex) {
            currentIndex = newIndex;
            
            navItems.forEach(item => item.classList.remove('active-text'));
            navItems[currentIndex].classList.add('active-text');

            tabContents.forEach(tab => tab.classList.remove('active'));
            const targetId = navItems[currentIndex].getAttribute('data-target');
            if(targetId) {
                const targetEl = document.getElementById(targetId);
                if(targetEl) targetEl.classList.add('active');
            }
            
            toggleBalanceVisibility(newIndex);
        }

        window.addEventListener('resize', () => {
            updatePillPosition(currentIndex, false);
        });

        // --- 5. ЛОГИКА ИГРОВЫХ РЕЖИМОВ (СЛАЙДЕР С МАГНИТОМ) ---
        const gamesList = document.getElementById('games-list');
        const trackIndicator = document.getElementById('track-indicator');
        
        // Данные режимов
        const gameModes = [
            { id: 1, name: 'Рулетка' },
            { id: 2, name: 'Сапёр' },
            { id: 3, name: 'Crash' }
        ];

        // SVG иконка замка
        const lockSvg = `
            <svg class="lock-icon" viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
        `;

        let currentGameIndex = 0;
        let isSliderDragging = false;
        let startY = 0;
        let startScrollTop = 0;
        let autoSwitchInterval;

        // Инициализация
        function initGamesSlider() {
            renderInitialCards();
            updateSliderState(false); // false = без анимации перехода
            
            // Обработчики ручного скролла
            gamesList.addEventListener('touchstart', handleTouchStart, {passive: false});
            gamesList.addEventListener('touchmove', handleTouchMove, {passive: false});
            gamesList.addEventListener('touchend', handleTouchEnd);
            
            gamesList.addEventListener('mousedown', handleMouseDown);
            window.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mouseup', handleMouseUp);

            // Запуск авто-переключения
            startAutoSwitch();
        }

        function renderInitialCards() {
            gamesList.innerHTML = '';
            
            // Создаем буфер из 3 элементов: [Предыдущий, Текущий, Следующий]
            const sequence = getSequence(currentGameIndex);
            
            sequence.forEach((modeIdx, i) => {
                const card = createCardElement(modeIdx, i);
                gamesList.appendChild(card);
            });

            // Добавляем спейсеры сверху и снизу для центрирования первой и последней карточки
            // Высота спейсера = (Высота экрана / 2) - (Высота карточки / 2)
            // Но так как высота карточки меняется (120px или квадрат), сделаем спейсеры динамическими или просто большими
            // Для простоты сделаем spacers высотой 50vh, это гарантирует, что карточка сможет встать по центру
            
            const spacerTop = document.createElement('div');
            spacerTop.className = 'scroll-spacer';
            spacerTop.style.height = '50vh';
            spacerTop.style.marginBottom = '-60px'; // Компенсация половины высоты маленькой карточки (120/2)
            gamesList.prepend(spacerTop);

            const spacerBottom = document.createElement('div');
            spacerBottom.className = 'scroll-spacer';
            spacerBottom.style.height = '50vh';
            spacerBottom.style.marginTop = '-60px';
            gamesList.appendChild(spacerBottom);

            // Скроллим к центральному элементу (индекс 1 в массиве из 3 элементов + 1 спейсер = индекс 2 в DOM)
            setTimeout(() => {
                const centerCard = gamesList.children[1]; // Индекс 1, т.к. 0 - это спейсер
                if(centerCard) {
                    const cardHeight = centerCard.offsetHeight; // Должно быть 120px изначально
                    const containerHeight = gamesList.clientHeight;
                    // Центрируем активную карточку
                    const offset = (containerHeight - cardHeight) / 2;
                    gamesList.scrollTop = centerCard.offsetTop - offset;
                }
                updateSliderState(false);
            }, 50);
        }

        // Функция получения правильного порядка карточек
        function getSequence(activeIndex) {
            const total = gameModes.length;
            const prev = (activeIndex - 1 + total) % total;
            const next = (activeIndex + 1) % total;
            return [prev, activeIndex, next];
        }

        function createCardElement(modeIdx, seqIdx) {
            const div = document.createElement('div');
            div.className = 'game-card'; // По умолчанию small
            div.dataset.modeIdx = modeIdx;
            div.dataset.seqIdx = seqIdx; 
            div.innerHTML = lockSvg;
            return div;
        }

        function updateSliderState(animate = true) {
            const cards = Array.from(gamesList.children).filter(el => el.classList.contains('game-card')); // Берем только карточки, игнорируем спейсеры
            const centerScroll = gamesList.scrollTop + (gamesList.clientHeight / 2);
            
            let closestCard = null;
            let minDiff = Infinity;

            // Находим карточку, чей центр ближе всего к центру экрана
            cards.forEach((card) => {
                const cardCenter = card.offsetTop + (card.offsetHeight / 2);
                const diff = Math.abs(centerScroll - cardCenter);
                if (diff < minDiff) {
                    minDiff = diff;
                    closestCard = card;
                }
            });

            if (closestCard) {
                const modeIdx = parseInt(closestCard.dataset.modeIdx);
                
                // Обновляем глобальный индекс только если мы действительно перешли на другую карточку
                if (currentGameIndex !== modeIdx) {
                    currentGameIndex = modeIdx;
                    // Перерисовываем DOM, чтобы сохранить правильный порядок (бесконечность)
                    rebuildListSmoothly(modeIdx);
                    return; // Прерываем, чтобы не применять классы к старым элементам, которые удалятся
                }

                // Обновляем классы размеров
                cards.forEach(c => {
                    c.classList.remove('large');
                    c.classList.add('small');
                });
                
                closestCard.classList.remove('small');
                closestCard.classList.add('large'); 

                // Обновляем ползунок
                updateScrollIndicator(animate);
            }
        }

        function rebuildListSmoothly(newIndex) {
            // Сохраняем текущую позицию скролла
            const currentScroll = gamesList.scrollTop;
            
            // Очищаем и пересоздаем
            gamesList.innerHTML = '';
            const sequence = getSequence(newIndex);
            
            sequence.forEach((modeIdx, i) => {
                const card = createCardElement(modeIdx, i);
                gamesList.appendChild(card);
            });

            // Возвращаем спейсеры
            const spacerTop = document.createElement('div');
            spacerTop.className = 'scroll-spacer';
            spacerTop.style.height = '50vh';
            spacerTop.style.marginBottom = '-60px';
            gamesList.prepend(spacerTop);

            const spacerBottom = document.createElement('div');
            spacerBottom.className = 'scroll-spacer';
            spacerBottom.style.height = '50vh';
            spacerBottom.style.marginTop = '-60px';
            gamesList.appendChild(spacerBottom);

            // Восстанавливаем скролл так, чтобы новая центральная карточка (индекс 1) была в центре
            setTimeout(() => {
                const centerCard = gamesList.children[1]; // Индекс 1, т.к. 0 - спейсер
                if(centerCard) {
                    const cardHeight = centerCard.offsetHeight;
                    const containerHeight = gamesList.clientHeight;
                    const offset = (containerHeight - cardHeight) / 2;
                    gamesList.scrollTop = centerCard.offsetTop - offset;
                }
                // Принудительно обновляем состояние после перерисовки
                updateSliderState(false);
            }, 10);
        }

        function updateScrollIndicator(animate) {
            const trackHeight = document.querySelector('.scroll-track').offsetHeight;
            const indicatorHeight = 12; 
            
            // Позиционирование индикатора зависит от currentGameIndex (0, 1, 2).
            let percent = 0;
            if (currentGameIndex === 0) percent = 15; // Рулетка (Верх)
            if (currentGameIndex === 1) percent = 50; // Сапер (Центр)
            if (currentGameIndex === 2) percent = 85; // Краш (Низ)

            const topPos = (trackHeight - indicatorHeight) * (percent / 100);
            
            trackIndicator.style.transition = animate ? 'top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), height 0.2s, border-radius 0.2s' : 'none';
            trackIndicator.style.top = `${topPos}px`;

            // Эффект Шар <-> Полоска
            if (isSliderDragging) {
                trackIndicator.classList.add('stretching'); 
            } else {
                trackIndicator.classList.remove('stretching'); 
            }
        }

        // --- Обработчики Драга для Слайдера ---
        function handleTouchStart(e) {
            isSliderDragging = true;
            startY = e.touches[0].clientY;
            startScrollTop = gamesList.scrollTop;
            gamesList.style.scrollBehavior = 'auto'; 
            updateSliderState(true); 
        }

        function handleTouchMove(e) {
            if (!isSliderDragging) return;
            e.preventDefault(); 
            const deltaY = startY - e.touches[0].clientY;
            gamesList.scrollTop = startScrollTop + deltaY;
            updateSliderState(true);
        }

        function handleTouchEnd() {
            if (!isSliderDragging) return;
            isSliderDragging = false;
            snapToNearest();
        }

        function handleMouseDown(e) {
            isSliderDragging = true;
            startY = e.clientY;
            startScrollTop = gamesList.scrollTop;
            gamesList.style.scrollBehavior = 'auto';
            updateSliderState(true);
        }

        function handleMouseMove(e) {
            if (!isSliderDragging) return;
            const deltaY = startY - e.clientY;
            gamesList.scrollTop = startScrollTop + deltaY;
            updateSliderState(true);
        }

        function handleMouseUp() {
            if (!isSliderDragging) return;
            isSliderDragging = false;
            snapToNearest();
        }

        function snapToNearest() {
            gamesList.style.scrollBehavior = 'smooth'; 
            updateSliderState(true); 
            
            setTimeout(() => {
                const cards = Array.from(gamesList.children).filter(el => el.classList.contains('game-card'));
                let closestCard = null;
                let minDiff = Infinity;
                const centerScroll = gamesList.scrollTop + (gamesList.clientHeight / 2);

                cards.forEach(card => {
                    const cardCenter = card.offsetTop + (card.offsetHeight / 2);
                    const diff = Math.abs(centerScroll - cardCenter);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestCard = card;
                    }
                });

                if (closestCard) {
                    const targetScroll = closestCard.offsetTop + (closestCard.offsetHeight / 2) - (gamesList.clientHeight / 2);
                    gamesList.scrollTop = targetScroll;
                }
            }, 10);
        }

        function startAutoSwitch() {
            if (autoSwitchInterval) clearInterval(autoSwitchInterval);
            autoSwitchInterval = setInterval(() => {
                if (currentIndex === 1 && !isSliderDragging) { 
                    gamesList.style.scrollBehavior = 'smooth';
                    // Скроллим вниз на высоту карточки + отступ
                    const cardHeight = gamesList.children[1] ? gamesList.children[1].offsetHeight : 120; // children[1] т.к. 0 - спейсер
                    gamesList.scrollTop += (cardHeight + 20);
                    
                    setTimeout(() => {
                         updateSliderState(true);
                    }, 400);
                }
            }, 15000);
        }

        // Запуск после загрузки
        setTimeout(initGamesSlider, 2200);

    </script>
</body>
</html>
