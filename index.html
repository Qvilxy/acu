<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BCB Casino</title>
    <!-- Подключаем скрипт Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* --- Базовые стили --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #4a0e2d, #7b1f4c);
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Экран загрузки --- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            background: inherit;
            transition: opacity 0.6s ease-out;
        }

        .loading-logo {
            width: 50%;
            max-width: 250px;
            height: auto;
            object-fit: contain;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* --- Шапка приложения (С учетом безопасной зоны iPhone) --- */
        header {
            /* Отступ сверху для статус-бара iPhone (обычно 20-45px) + немного воздуха */
            padding-top: env(safe-area-inset-top, 20px); 
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.1); /* Легкое затемнение */
            flex-shrink: 0;
            z-index: 10;
            width: 100%;
        }

        .header-logo {
            /* Размер под ваше фото: широкий и невысокий */
            height: 25px; 
            width: auto;
            max-width: 80%;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        /* --- Основной контент --- */
        main {
            flex-grow: 1;
            position: relative;
            overflow-y: auto;
            /* Отступ снизу, чтобы контент не перекрывался парящим меню */
            padding-bottom: 120px; 
            width: 100%;
        }

        .tab-content {
            display: none;
            width: 100%;
            min-height: 100%;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block; /* Просто блок, без центрирования Flex, чтобы фон был чистым */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Стили для вкладки "В разработке" */
        .dev-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2em;
            font-weight: 500;
        }

        /* Стили для вкладки "Профиль" */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 12px;
            /* Убрал фон контейнера, чтобы было чище, или можно оставить легким */
        }

        .user-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.15);
            object-fit: cover;
            background-color: rgba(0, 0, 0, 0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .user-name {
            font-size: 1.6em;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .user-username {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }

        /* --- ПАРЯЩЕЕ МЕНЮ (Floating Pill Navigation) --- */
        nav {
            position: fixed;
            bottom: 25px; /* Отступ от низа экрана */
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 420px;
            height: 70px;
            
            /* Дизайн "таблетки" */
            background: rgba(255, 255, 255, 0.95); /* Почти белый фон */
            border-radius: 40px; /* Сильное скругление */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); /* Глубокая тень */
            
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px; /* Внутренний отступ */
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 35px; /* Скругление для активной плитки */
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            color: #8E8E93; /* Цвет неактивных элементов (темно-серый) */
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            fill: currentColor;
            transition: transform 0.2s;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* Состояние активной вкладки */
        .nav-item.active {
            background-color: #D1D1D6; /* Светло-серая "плитка" */
            color: #F2F2F7; /* Очень светло-серый (почти белый) текст и иконка */
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
        }

        .nav-item.active svg {
            transform: scale(1.05);
        }

        /* Эффект нажатия */
        .nav-item:active {
            transform: scale(0.96);
        }

    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loading-screen">
        <img src="bcblogo.PNG" alt="BCB Logo" class="loading-logo">
    </div>

    <!-- Шапка с логотипом -->
    <header>
        <img src="bcbtextlogo.PNG" alt="BCB Text Logo" class="header-logo">
    </header>

    <!-- Контент -->
    <main>
        <!-- Вкладка 1: Играть (Главная) - ПУСТАЯ -->
        <div id="tab-play" class="tab-content active">
            <!-- Здесь ничего нет, только фон -->
        </div>

        <!-- Вкладка 2: В разработке - МИНИМАЛИСТИЧНАЯ -->
        <div id="tab-dev" class="tab-content">
            <div class="dev-placeholder">
                <p>Раздел в разработке</p>
            </div>
        </div>

        <!-- Вкладка 3: Профиль -->
        <div id="tab-profile" class="tab-content">
            <div class="profile-container">
                <img id="profile-avatar" src="" alt="Avatar" class="user-avatar">
                <div id="profile-name" class="user-name">Загрузка...</div>
                <div id="profile-username" class="user-username">@...</div>
            </div>
        </div>
    </main>

    <!-- Парящее меню навигации -->
    <nav>
        <!-- Вкладка Играть -->
        <div class="nav-item active" data-target="tab-play">
            <!-- Иконка Джойстика/Игры -->
            <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            <span>Играть</span>
        </div>
        
        <!-- Вкладка В разработке -->
        <div class="nav-item" data-target="tab-dev">
            <!-- Иконка Шестеренки -->
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            <span>В разработке</span>
        </div>
        
        <!-- Вкладка Профиль -->
        <div class="nav-item" data-target="tab-profile">
            <!-- Иконка Пользователя -->
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Профиль</span>
        </div>
    </nav>

    <script>
        // --- Инициализация Telegram WebApp ---
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Установка цветов темы
        tg.setHeaderColor('#4a0e2d'); // Темный бордовый
        tg.setBackgroundColor('#4a0e2d');

        // --- Данные пользователя ---
        const user = tg.initDataUnsafe.user || {};
        
        const avatarImg = document.getElementById('profile-avatar');
        const nameDiv = document.getElementById('profile-name');
        const usernameDiv = document.getElementById('profile-username');

        // Заполнение профиля
        if (user.photo_url) {
            avatarImg.src = user.photo_url;
        } else {
            // Дефолтная аватарка, если нет фото
            avatarImg.src = 'https://via.placeholder.com/150/ffffff/4a0e2d?text=User';
        }

        nameDiv.textContent = user.first_name + (user.last_name ? ' ' + user.last_name : '') || 'Игрок BCB';
        usernameDiv.textContent = user.username ? '@' + user.username : 'Нет юзернейма';


        // --- Логика загрузки ---
        const loadingScreen = document.getElementById('loading-screen');
        
        window.addEventListener('load', () => {
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 600);
            }, 2000); // 2 секунды заставки
        });


        // --- Логика навигации ---
        const navItems = document.querySelectorAll('.nav-item');
        const tabContents = document.querySelectorAll('.tab-content');

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                // Если уже активна, ничего не делаем
                if (item.classList.contains('active')) return;

                // Убираем активный класс у всех
                navItems.forEach(nav => nav.classList.remove('active'));
                tabContents.forEach(tab => tab.classList.remove('active'));

                // Добавляем активный класс нажатой кнопке
                item.classList.add('active');

                // Показываем соответствующий таб
                const targetId = item.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
                
                // Тактильный отклик (вибрация)
                if(tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            });
        });

    </script>
</body>
</html>
