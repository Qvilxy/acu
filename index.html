<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BCB Casino</title>
    <!-- Подключаем скрипт Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Сброс стилей и базовые настройки */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Градиентный фон (темно-бордовый/фиолетовый) */
            background: linear-gradient(135deg, #4a0e2d, #7b1f4c);
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Запрещаем прокрутку */
            position: relative;
        }

        /* --- Экран загрузки --- */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center; /* Центр по горизонтали */
            align-items: center;     /* Центр по вертикали */
            z-index: 100;
            background: inherit;     /* Наследуем градиент фона */
            transition: opacity 0.6s ease-out; /* Плавное исчезновение */
        }

        .loading-logo {
            width: 50%;              /* Размер логотипа относительно экрана */
            max-width: 250px;        /* Максимальный размер */
            height: auto;
            object-fit: contain;
            animation: pulseLogo 2s infinite ease-in-out; /* Легкая пульсация */
        }

        /* Анимация пульсации логотипа */
        @keyframes pulseLogo {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        /* Класс для скрытия экрана загрузки */
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* --- Основной интерфейс --- */
        #app-interface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Интерфейс полностью пустой, виден только фон body */
            display: none; /* Скрыт до конца загрузки */
            opacity: 0;
            transition: opacity 0.6s ease-in;
        }

        /* Класс для плавного появления интерфейса */
        .visible {
            display: block !important;
            opacity: 1 !important;
        }

    </style>
</head>
<body>

    <!-- Экран загрузки: только логотип по центру -->
    <div id="loading-screen">
        <!-- Убедитесь, что файл bcblogo.png лежит рядом с index.html -->
        <img src="bcblogo.PNG" alt="BCB Logo" class="loading-logo">
    </div>

    <!-- Основной интерфейс: полностью пустой -->
    <div id="app-interface">
        <!-- Здесь ничего нет, виден только градиентный фон -->
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        
        // Сообщаем телеграму, что приложение готово
        tg.ready();
        
        // Разворачиваем на весь экран
        tg.expand();
        
        // Устанавливаем цвет хедера в тон фона (темно-бордовый)
        tg.setHeaderColor('#4a0e2d');
        tg.setBackgroundColor('#4a0e2d');

        const loadingScreen = document.getElementById('loading-screen');
        const appInterface = document.getElementById('app-interface');

        // Логика переключения экранов
        window.addEventListener('load', () => {
            // Время показа заставки (в миллисекундах)
            const splashDuration = 2500; 

            setTimeout(() => {
                // 1. Начинаем скрывать заставку
                loadingScreen.classList.add('hidden');

                // 2. Показываем пустой интерфейс
                appInterface.classList.add('visible');

                // 3. Полностью удаляем заставку из DOM после анимации (опционально)
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 600); // Время должно совпадать с transition в CSS (0.6s)

            }, splashDuration);
        });
    </script>
</body>
</html>
